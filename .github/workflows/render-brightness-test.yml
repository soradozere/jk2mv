name: Brightness Test

# Renders come out dark. Which lever actually reaches the captured frames?
#
# Established by reading tr_image.cpp and the last run's log rather than guessed:
#
#   - postprocessing gamma needs ARB assembly programs llvmpipe does not have,
#     so r_gammamethod falls back to hardware ("falling back to hardware gamma"
#     in run 31104091183)
#   - hardware gamma + windowed forces tr.overbrightBits to 0, which is the stop
#     the picture is missing
#   - and R_LightScaleTexture only folds s_gammatable into textures when
#     r_gammamethod is NONE. Under hardware it goes to the display ramp instead,
#     and an AVI is read back from the framebuffer long before any display ramp
#
# So r_gamma has never done anything to a render, and r_intensity -- a flat
# multiply that clips at 255 -- has been the only lever. That is why intensity 2
# blew out the skybox while the dark parts stayed dark.
#
# r_gammamethod 0 is the untried one: it takes the branch that bakes the curve
# into the textures, so it reaches the capture, and being a curve it lifts
# shadows and midtones while leaving highlights near white alone.
#
# Renders the same window five ways and reports mean brightness over the whole
# clip. Not a single frame: the last attempt at this landed on a saber clash and
# compared a light plume against an empty corridor.
#
# Read the engine passes with care even so. Each is a separate run, and separate
# runs start capture at different demo moments -- the first sweep produced 531
# frames for one pass and 537 for another, of visibly different action, which
# makes their means incomparable however many frames go into them. Only the
# ffmpeg pass is a true comparison, because it is the baseline's own frames
# regraded. Pinning every pass with seekdemo would fix this and is the obvious
# next move if the engine-side options ever need a real answer.
on:
  workflow_dispatch:

env:
  ASSET_VERSION: "20260805"
  R2_PUBLIC: "https://pub-76bff0ef02794a5d95b7e2a8b8660f61.r2.dev"

jobs:
  brightness:
    name: Which lever reaches the frames
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true, fetch-depth: 0, path: jk2mv }

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsdl2-dev libgl1-mesa-dev libopenal-dev libjpeg-dev libpng-dev libminizip-dev \
            xvfb libgl1-mesa-dri ffmpeg

      - name: Build engine
        run: |
          cmake -S jk2mv -B jk2mv/build/actions \
            -DCMAKE_BUILD_TYPE=Release -DUseInternalLibs=OFF -DBuildPortableVersion=ON
          cmake --build jk2mv/build/actions -j"$(nproc)"

      - name: Resolve game root
        id: root
        run: echo "ROOT=$GITHUB_WORKSPACE/jk2mv/build/actions/out/Release" >> "$GITHUB_OUTPUT"

      - name: Restore game assets from cache
        id: assetcache
        uses: actions/cache@v4
        with: { path: assets/base-min.tar, key: "jk2-assets-20260805" }

      - name: Download game assets
        if: steps.assetcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets
          curl -fsSL -o assets/base-min.tar "$R2_PUBLIC/render-assets/$ASSET_VERSION/base-min.tar"

      - name: Stage
        env: { ROOT: "${{ steps.root.outputs.ROOT }}" }
        run: |
          mkdir -p "$ROOT/base/demos"
          tar -xf assets/base-min.tar -C "$ROOT/base"
          # "Owned cheese" on ctf_yavin_no_outside -- a calm stretch with sky in
          # shot, which is the thing that blew out last time.
          curl -fsSL -o "$ROOT/base/demos/gate-demo.dm_15" \
            "$R2_PUBLIC/demos/76419644-7ca3-4632-8086-cbe80e9c0969.dm_15"

      - name: Render each candidate
        timeout-minutes: 60
        env:
          ROOT: ${{ steps.root.outputs.ROOT }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_AUDIODRIVER: "dummy"
        run: |
          set -u
          # 720p: brightness does not depend on resolution, and this is four
          # times cheaper than the 1440p production renders.
          pass () {
            NAME="$1"; shift
            {
              echo "set com_hunkMegs 256"
              echo "set r_mode -1"; echo "set r_customwidth 1280"; echo "set r_customheight 720"
              echo "set r_fullscreen 0"; echo "set r_swapInterval 0"
              echo "set s_useOpenAL 0"
              echo "set cl_aviFrameRate 30"
              echo "set cl_aviMotionJpeg 1"; echo "set cl_aviMotionJpegQuality 95"
              echo "set cg_fov 120"; echo "set cg_draw2D 1"
              echo "set cl_noprint 0"; echo "set con_notifytime 10"; echo "set cg_drawChat 0"
              echo ""
              echo "demo gate-demo"
              echo "wait 20"
              echo "set cg_demoFollow -1"
              echo "set cg_thirdPerson 1"; echo "set cg_thirdPersonRange 80"
              echo "set cg_thirdPersonAngle 0"; echo "set cg_cameraOrbit 0"
              echo "wait 200"
              echo "video $NAME"
              echo "wait 1200"
              echo "stopvideo"
              echo "quit"
            } > "$ROOT/base/$NAME.cfg"

            # All of these are read when textures are uploaded, which happens
            # before a cfg gets a chance to run -- r_intensity and r_gammamethod
            # are CVAR_LATCH besides. Command line only.
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              "$ROOT/jk2mvmp" +set fs_basepath "$ROOT" +set fs_homepath "$ROOT" \
              "$@" \
              +exec "$NAME.cfg" 2>&1 | grep -iE "gamma method|gamma correction not supported|overbright" | head -4
            echo "--- rendered $NAME with $*"
          }

          # The one in production now.
          pass baseline           +set r_intensity 1
          # The rejected one, for scale: this is the skybox that washed out.
          pass intensity-2        +set r_intensity 2
          # The untried branch, two strengths.
          pass gamma-1.2          +set r_gammamethod 0 +set r_gamma 1.2 +set r_intensity 1
          pass gamma-1.5          +set r_gammamethod 0 +set r_gamma 1.5 +set r_intensity 1
          # Gamma plus the overbright stop that windowed mode threw away.
          pass gamma-1.3-ob       +set r_gammamethod 0 +set r_gamma 1.3 +set r_intensity 1 +set r_overBrightBits 1

      - name: Measure
        env: { ROOT: "${{ steps.root.outputs.ROOT }}" }
        run: |
          set -u
          mkdir -p out
          measure () {
            f="$1"; label="$2"
            printf '%-16s ' "$label"
            ffmpeg -nostdin -i "$f" \
              -vf "format=gray,signalstats,metadata=print:key=lavfi.signalstats.YAVG" \
              -f null - 2>&1 | grep -o "YAVG=[0-9.]*" | cut -d= -f2 \
              | awk '{s+=$1; n++} END {if(n) printf "mean %.2f over %d frames\n", s/n, n; else print "n/a"}'
          }

          echo "=============================================="
          for AVI in $(ls -1 "$ROOT"/base/videos/*.avi | sort); do
            N=$(basename "$AVI" .avi)
            ffmpeg -nostdin -y -i "$AVI" -c:v libx264 -crf 20 -preset veryfast \
              -pix_fmt yuv420p -an "out/$N.mp4" >/dev/null 2>&1 || true
            measure "out/$N.mp4" "$N"
            # Same frame from every pass, for eyeballing. The clip is calm here.
            ffmpeg -nostdin -y -ss 8 -i "out/$N.mp4" -frames:v 1 "out/$N.jpg" >/dev/null 2>&1 || true
          done

          # The other way to do it entirely: leave the engine alone and lift the
          # final encode. Included so the comparison is honest -- if this looks
          # as good, it needs no engine change at all.
          if [ -f out/baseline.mp4 ]; then
            ffmpeg -nostdin -y -i out/baseline.mp4 -vf "eq=gamma=1.3" \
              -c:v libx264 -crf 20 -preset veryfast -pix_fmt yuv420p -an \
              out/ffmpeg-gamma-1.3.mp4 >/dev/null 2>&1 || true
            measure out/ffmpeg-gamma-1.3.mp4 "ffmpeg-gamma"
            ffmpeg -nostdin -y -ss 8 -i out/ffmpeg-gamma-1.3.mp4 -frames:v 1 \
              out/ffmpeg-gamma-1.3.jpg >/dev/null 2>&1 || true
          fi
          echo "=============================================="

          # Highlight clipping is the thing that killed intensity 2, and a mean
          # cannot show it: a washed sky and a brighter room read the same.
          # YHIGH is signalstats' high percentile, not a count of white pixels
          # -- what matters is how far it moves relative to the mean. A lift
          # that raises the mean more than this is lifting shadows; one that
          # raises this more is heading for a blown sky.
          echo "=== high-percentile luma, against the mean above ==="
          for f in $(ls -1 out/*.mp4 | sort); do
            printf '%-28s ' "$(basename "$f")"
            ffmpeg -nostdin -i "$f" -vf "format=gray,signalstats,metadata=print:key=lavfi.signalstats.YHIGH" \
              -f null - 2>&1 | grep -o "YHIGH=[0-9.]*" | cut -d= -f2 \
              | awk '{s+=$1; n++} END {if(n) printf "%.4f\n", s/n; else print "n/a"}'
          done
          ls -la out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brightness-test-output
          path: out/
          retention-days: 7
          if-no-files-found: warn
