<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>OpenJK — Jedi Academy</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #eee;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #status {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
        }

        canvas.emscripten {
            border: 0;
            cursor: none;
            outline: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .spinner {
            display: none;
        }

        #output {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: rgba(0, 0, 0, 0.85);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            padding: 5px;
            display: none;
        }

        /* Playback controls. Kept out of the way until the pointer is near the
           bottom of the frame, so they don't sit over the action while watching. */
        #controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px 18px;
            background: linear-gradient(to top, rgba(8, 10, 14, 0.94), rgba(8, 10, 14, 0.72) 60%, rgba(8, 10, 14, 0));
            font-size: 12px;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity .18s ease, transform .18s ease;
        }

        #controls.show,
        #controls:hover,
        #controls:focus-within {
            opacity: 1;
            transform: none;
        }

        #controls .row {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        /* display:flex above would otherwise win over the hidden attribute */
        #controls .row[hidden],
        #controls[hidden] {
            display: none;
        }

        #controls .group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 130px;
        }

        #controls .group.grow {
            flex: 1 1 160px;
        }

        #controls label {
            color: #93a1b5;
            font-size: 11px;
            letter-spacing: .02em;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        #controls .val {
            color: #e6edf6;
            font-variant-numeric: tabular-nums;
        }

        .btn {
            background: rgba(255, 255, 255, .08);
            color: #e6edf6;
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 6px;
            padding: 7px 12px;
            font: inherit;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(255, 255, 255, .15);
        }

        .btn.wide {
            min-width: 84px;
        }

        .btn.on {
            background: #2f81f7;
            border-color: #2f81f7;
            color: #fff;
        }

        .speeds {
            display: flex;
            gap: 4px;
        }

        .speeds .btn {
            padding: 6px 9px;
        }

        #controls .hint {
            color: #7d8b9e;
            font-size: 11px;
            line-height: 1.5;
            align-self: center;
        }

        #controls .hint b {
            color: #b9c6d6;
            font-weight: 600;
        }

        #controls input[type=range] {
            width: 100%;
            accent-color: #2f81f7;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="status">Downloading...</div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="controls" hidden>
        <div class="row">
            <button id="playPause" class="btn wide" title="Play / pause (Space)">Pause</button>

            <div class="group">
                <label>Speed</label>
                <div class="speeds" id="speeds"></div>
            </div>

            <div class="group grow">
                <label>Field of view <span class="val" id="fovVal">80</span></label>
                <input type="range" id="fov" min="60" max="130" step="1" value="80">
            </div>

            <div class="group">
                <label>Camera</label>
                <div class="speeds" id="camModes"></div>
            </div>
        </div>

        <div class="row" id="freeRow" hidden>
            <div class="group grow">
                <label>Flight speed <span class="val" id="camSpeedVal">800</span></label>
                <input type="range" id="camSpeed" min="100" max="3000" step="50" value="800">
            </div>
            <div class="group grow hint">
                Click the view to look around. <b>W A S D</b> flies, <b>Space</b> and <b>C</b> go up and down,
                <b>Esc</b> releases the mouse.
            </div>
        </div>

        <div class="row" id="orbitRow" hidden>
            <div class="group grow">
                <label>Camera distance <span class="val" id="rangeVal">80</span></label>
                <input type="range" id="range" min="20" max="400" step="5" value="80">
            </div>
            <div class="group grow">
                <label>Camera angle <span class="val" id="angleVal">0</span>&deg;</label>
                <input type="range" id="angle" min="-180" max="180" step="5" value="0">
            </div>
            <div class="group grow">
                <label>Camera height <span class="val" id="heightVal">0</span></label>
                <input type="range" id="height" min="-60" max="120" step="5" value="0">
            </div>
        </div>
    </div>

    <div id="output"></div>

    <script type='text/javascript'>
        console.log("--- SHELL VERSION: 2026-03-08 11:13 ---");
        window.addEventListener('error', function (e) {
            console.error('WASMDBG_JSERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno + (e.error && e.error.stack ? ('\n' + e.error.stack) : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
            console.error('WASMDBG_JSREJECT: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
        });
        var statusElement = document.getElementById('status');
        var canvasElement = document.getElementById('canvas');
        var outputElement = document.getElementById('output');

        // Toggle console with backtick
        document.addEventListener('keydown', function (e) {
            if (e.key === '`') {
                outputElement.style.display = outputElement.style.display === 'none' ? 'block' : 'none';
            }
        });

        // Optional ?demo=<name> queues "+demo <name>" as a real command-line arg,
        // which Com_AddStartupCommands() runs AFTER CL_Init() registers "demo" --
        // unlike autoexec.cfg, which execs too early and hits "Unknown command".
        var __demoParam = new URLSearchParams(location.search).get('demo');
        var Module = {
            arguments: __demoParam ? ['+demo', __demoParam] : [],
            print: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
                if (outputElement) {
                    outputElement.innerHTML += text + '<br>';
                    outputElement.scrollTop = outputElement.scrollHeight;
                }
            },
            printErr: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                // Bounded ring buffer: the devtools console evicts early startup
                // lines long before they can be read back, and an unbounded array
                // is enough output to lock the tab up.
                var b = window.__log || (window.__log = []);
                b.push(text);
                if (b.length > 400) b.shift();
                console.error(text);
            },
            canvas: canvasElement,
            setStatus: function (text) {
                if (text) statusElement.innerHTML = text;
                else statusElement.style.display = 'none';
            },
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'Running...');
            },
            preRun: [function () {
                try {
                    FS.mkdir('/saves');
                } catch (e) { }
            }]
        };
        Module.setStatus('Downloading...');
        window.onerror = function () {
            Module.setStatus('Exception thrown, see JavaScript console');
        };

        // ---- Playback controls -------------------------------------------------
        // Everything here drives engine cvars through the JKD_Exec bridge, so the
        // UI stays a thin shell over the engine's own state rather than keeping a
        // parallel copy of it.
        (function () {
            var exec = null, getCvar = null;
            var controls = document.getElementById('controls');
            var els = {
                playPause: document.getElementById('playPause'),
                speeds: document.getElementById('speeds'),
                fov: document.getElementById('fov'),
                fovVal: document.getElementById('fovVal'),
                camModes: document.getElementById('camModes'),
                freeRow: document.getElementById('freeRow'),
                camSpeed: document.getElementById('camSpeed'),
                camSpeedVal: document.getElementById('camSpeedVal'),
                orbitRow: document.getElementById('orbitRow'),
                range: document.getElementById('range'),
                rangeVal: document.getElementById('rangeVal'),
                angle: document.getElementById('angle'),
                angleVal: document.getElementById('angleVal'),
                height: document.getElementById('height'),
                heightVal: document.getElementById('heightVal')
            };

            var paused = false;
            var camMode = 'first';
            var speed = 1;
            var SPEEDS = [0.1, 0.25, 0.5, 1, 2, 4];
            var CAM_MODES = [
                { id: 'first', label: 'Follow' },
                { id: 'third', label: 'Chase' },
                { id: 'free', label: 'Free fly' }
            ];

            function setCvar(name, value) {
                if (exec) exec(name + ' ' + value);
            }

            // Hand the keyboard back to the engine after a control is used. The
            // stopPropagation guard further down is scoped to #controls, so as
            // long as a button keeps focus every keystroke is swallowed there --
            // which silently breaks flying the free camera the moment you click
            // "Free fly", since the button that turned it on is still focused.
            function releaseFocus() {
                if (document.activeElement && controls.contains(document.activeElement)) {
                    document.activeElement.blur();
                }
                canvasElement.focus();
            }

            function setPaused(p) {
                paused = p;
                setCvar('cl_freezeDemo', paused ? 1 : 0);
                els.playPause.textContent = paused ? 'Play' : 'Pause';
                els.playPause.classList.toggle('on', paused);
            }

            function setSpeed(s) {
                speed = s;
                setCvar('timescale', s);
                Array.prototype.forEach.call(els.speeds.children, function (b) {
                    b.classList.toggle('on', parseFloat(b.dataset.speed) === s);
                });
            }

            // Chase framing lives in cvars the engine keeps between modes, so
            // leaving Chase and coming back to Follow would otherwise carry a
            // 400-unit pullback and a 90 degree orbit into a view that is
            // supposed to be the recorded one.
            var CHASE_DEFAULTS = [
                ['range', 'rangeVal', 'cg_thirdPersonRange', 80, ''],
                ['angle', 'angleVal', 'cg_thirdPersonAngle', 0, '°'],
                ['height', 'heightVal', 'cg_thirdPersonVertOffset', 0, '']
            ];

            function resetChase() {
                CHASE_DEFAULTS.forEach(function (d) {
                    els[d[0]].value = d[3];
                    els[d[1]].textContent = d[3] + d[4];
                    setCvar(d[2], d[3]);
                });
            }

            function setCamMode(mode) {
                if (camMode === 'third' && mode !== 'third') resetChase();
                camMode = mode;
                setCvar('cg_thirdPerson', mode === 'third' ? 1 : 0);
                setCvar('cg_demoCam', mode === 'free' ? 1 : 0);
                els.orbitRow.hidden = mode !== 'third';
                els.freeRow.hidden = mode !== 'free';
                Array.prototype.forEach.call(els.camModes.children, function (b) {
                    b.classList.toggle('on', b.dataset.mode === mode);
                });
            }

            SPEEDS.forEach(function (s) {
                var b = document.createElement('button');
                b.className = 'btn';
                b.textContent = (s === 1 ? '1' : String(s)) + '×';
                b.dataset.speed = s;
                b.onclick = function () { setSpeed(s); releaseFocus(); };
                els.speeds.appendChild(b);
            });

            CAM_MODES.forEach(function (m) {
                var b = document.createElement('button');
                b.className = 'btn';
                b.textContent = m.label;
                b.dataset.mode = m.id;
                b.onclick = function () { setCamMode(m.id); releaseFocus(); };
                els.camModes.appendChild(b);
            });

            els.playPause.onclick = function () { setPaused(!paused); releaseFocus(); };

            function bindRange(el, valEl, cvar, suffix) {
                el.addEventListener('input', function () {
                    valEl.textContent = el.value + (suffix || '');
                    setCvar(cvar, el.value);
                });
                // on release, not on input -- blurring mid-drag would end the drag
                el.addEventListener('change', releaseFocus);
            }
            bindRange(els.fov, els.fovVal, 'cg_fov');
            bindRange(els.camSpeed, els.camSpeedVal, 'cg_demoCamSpeed');
            bindRange(els.range, els.rangeVal, 'cg_thirdPersonRange');
            bindRange(els.angle, els.angleVal, 'cg_thirdPersonAngle', '°');
            bindRange(els.height, els.heightVal, 'cg_thirdPersonVertOffset');

            // Keep keystrokes aimed at the controls away from the engine, which
            // otherwise also sees them (space would toggle pause *and* reach the
            // game, arrow keys would nudge a slider and the view at once).
            ['keydown', 'keyup', 'keypress'].forEach(function (t) {
                controls.addEventListener(t, function (e) { e.stopPropagation(); });
            });

            // Space toggles pause anywhere except while a control has focus -- and
            // except in free-fly, where Space is the camera's "up" and has to reach
            // the engine untouched.
            window.addEventListener('keydown', function (e) {
                if (e.code === 'Space' && camMode !== 'free' && !controls.contains(document.activeElement)) {
                    e.preventDefault();
                    setPaused(!paused);
                }
            });

            // Reveal on pointer activity near the bottom of the frame.
            var hideTimer = null;
            window.addEventListener('mousemove', function (e) {
                var nearBottom = e.clientY > window.innerHeight - 160;
                controls.classList.toggle('show', nearBottom);
                clearTimeout(hideTimer);
                if (nearBottom) {
                    hideTimer = setTimeout(function () {
                        if (!controls.matches(':hover, :focus-within')) controls.classList.remove('show');
                    }, 2500);
                }
            });

            // Wire up once the engine is actually running, then seed the controls
            // from the engine's real cvar values instead of assuming the defaults.
            window.JKD_ready = function () {
                exec = Module.cwrap('JKD_Exec', null, ['string']);
                getCvar = Module.cwrap('JKD_GetCvar', 'number', ['string']);

                var fov = getCvar('cg_fov') || 80;
                els.fov.value = fov;
                els.fovVal.textContent = Math.round(fov);

                setSpeed(1);
                setPaused(false);
                setCamMode('first');
                controls.hidden = false;
                controls.classList.add('show');
                setTimeout(function () { controls.classList.remove('show'); }, 3000);
            };
        })();
    </script>
    {{{ SCRIPT }}}
</body>

</html>
