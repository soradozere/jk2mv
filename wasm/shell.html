<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>OpenJK — Jedi Academy</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #eee;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #status {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
        }

        canvas.emscripten {
            border: 0;
            cursor: none;
            outline: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .spinner {
            display: none;
        }

        #output {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: rgba(0, 0, 0, 0.85);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            padding: 5px;
            display: none;
        }
    </style>
</head>

<body>
    <div id="status">Downloading...</div>
    <div id="version-marker" style="position:fixed; top:10px; right:10px; color:red; font-size:10px; z-index:100;">Shell: 11:13</div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="output"></div>

    <script type='text/javascript'>
        console.log("--- SHELL VERSION: 2026-03-08 11:13 ---");
        window.addEventListener('error', function (e) {
            console.error('WASMDBG_JSERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno + (e.error && e.error.stack ? ('\n' + e.error.stack) : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
            console.error('WASMDBG_JSREJECT: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
        });
        var statusElement = document.getElementById('status');
        var canvasElement = document.getElementById('canvas');
        var outputElement = document.getElementById('output');

        // Toggle console with backtick
        document.addEventListener('keydown', function (e) {
            if (e.key === '`') {
                outputElement.style.display = outputElement.style.display === 'none' ? 'block' : 'none';
            }
        });

        // Optional ?demo=<name> queues "+demo <name>" as a real command-line arg,
        // which Com_AddStartupCommands() runs AFTER CL_Init() registers "demo" --
        // unlike autoexec.cfg, which execs too early and hits "Unknown command".
        var __demoParam = new URLSearchParams(location.search).get('demo');
        var Module = {
            arguments: __demoParam ? ['+demo', __demoParam] : [],
            print: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
                if (outputElement) {
                    outputElement.innerHTML += text + '<br>';
                    outputElement.scrollTop = outputElement.scrollHeight;
                }
            },
            printErr: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            canvas: canvasElement,
            setStatus: function (text) {
                if (text) statusElement.innerHTML = text;
                else statusElement.style.display = 'none';
            },
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'Running...');
            },
            preRun: [function () {
                try {
                    FS.mkdir('/saves');
                } catch (e) { }
            }]
        };
        Module.setStatus('Downloading...');
        window.onerror = function () {
            Module.setStatus('Exception thrown, see JavaScript console');
        };
    </script>
    {{{ SCRIPT }}}
</body>

</html>
