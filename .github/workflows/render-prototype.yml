name: Render Prototype (Gate 1a/1b)

# Gate for the YouTube render pipeline: prove that a native jk2mv build can
# render a demo headlessly, offline, WITH audio, on a stock Actions runner.
# Nothing downstream gets built until this passes.
#
# Runs here for now only because a workflow_dispatch workflow must sit on a
# repo's default branch to be dispatchable, and this one already is. The real
# render workflow will live in Soracle, which owns the demo library and R2.
#
# workflow_dispatch only. This must never run on push.
on:
  workflow_dispatch:
    inputs:
      fps:
        description: "Render framerate"
        default: "30"
      width:
        description: "Render width"
        default: "1280"
      height:
        description: "Render height"
        default: "720"

env:
  # Versioned prefix: bumping it invalidates the asset cache automatically.
  ASSET_VERSION: "20260805"
  R2_PUBLIC: "https://pub-76bff0ef02794a5d95b7e2a8b8660f61.r2.dev"

jobs:
  render:
    name: Native headless render + ffmpeg convert
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the engine
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          path: jk2mv

      - name: Install build + render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsdl2-dev libgl1-mesa-dev libopenal-dev libjpeg-dev libpng-dev libminizip-dev \
            xvfb libgl1-mesa-dri \
            ffmpeg

      # ~121MB. Re-downloading it every run is the single biggest lever on job
      # duration, so cache it and key on the version prefix.
      - name: Restore game assets from cache
        id: assetcache
        uses: actions/cache@v4
        with:
          path: assets/base-min.tar
          key: jk2-assets-${{ env.ASSET_VERSION }}

      - name: Download game assets
        if: steps.assetcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets
          curl -fsSL -o assets/base-min.tar \
            "$R2_PUBLIC/render-assets/$ASSET_VERSION/base-min.tar"

      - name: Stage GameData
        run: |
          mkdir -p GameData/base/demos
          tar -xf assets/base-min.tar -C GameData/base
          # The gate uses a known-good clip on a map present in base-min.
          # Production fetches the trimmed demo from the demos/ prefix instead.
          curl -fsSL -o "GameData/base/demos/gate-demo.dm_15" \
            "$R2_PUBLIC/render-assets/$ASSET_VERSION/gate-demo.dm_15"
          ls -la GameData/base GameData/base/demos

      - name: Build engine
        run: |
          cmake -S jk2mv -B jk2mv/build/actions \
            -DCMAKE_BUILD_TYPE=Release -DUseInternalLibs=OFF -DBuildPortableVersion=ON
          cmake --build jk2mv/build/actions -j"$(nproc)"

      - name: Locate built binary
        id: bin
        run: |
          # Client target is jk2mvmp (CMakeLists.txt: set(MVMP "jk2mvmp")).
          BIN=$(find jk2mv/build/actions -type f -executable -name "jk2mvmp*" ! -name "*.so" | head -1)
          if [ -z "$BIN" ]; then
            echo "No jk2mvmp binary found; build tree was:" >&2
            find jk2mv/build/actions -type f -executable | head -50
            exit 1
          fi
          echo "BIN=$(realpath "$BIN")" >> "$GITHUB_OUTPUT"

      - name: Write render config
        run: |
          cat > GameData/base/render.cfg <<EOF
          set com_hunkMegs 256

          // Software GL under xvfb -- windowed, no vsync pacing.
          set r_mode -1
          set r_customwidth ${{ inputs.width }}
          set r_customheight ${{ inputs.height }}
          set r_fullscreen 0
          set r_swapInterval 0

          // AVI audio is captured only from the base DMA mixer. Under OpenAL
          // cl_avi.cpp bails with "Set s_useOpenAL to 0 for audio capture" and
          // the render comes out silent, so this is mandatory, not taste.
          set s_useOpenAL 0
          set s_initsound 1
          set s_volume 0.8

          set cl_aviFrameRate ${{ inputs.fps }}
          set cl_aviMotionJpeg 1
          set cl_aviMotionJpegQuality 90

          // Clean picture: no HUD or console burnt into the frames.
          set cg_draw2D 0
          set con_notifytime 0
          set cl_noprint 1

          // CL_NextDemo fires when playback ends -- this is what stops the job.
          set nextdemo "stopvideo; quit"

          // Order matters. Capture only locks to a fixed offline timestep once
          // cls.state reaches CA_ACTIVE (cl_main.cpp), so start playback first
          // and let the map finish loading before the first frame is written.
          demo gate-demo
          wait 200
          video render-gate1
          EOF
          cat GameData/base/render.cfg

      - name: Render headless under xvfb
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"   # llvmpipe, not the runner's absent GPU
          SDL_AUDIODRIVER: "dummy"     # no sound card; DMA mixer still needs a device
        run: |
          START=$(date +%s)
          xvfb-run --auto-servernum --server-args="-screen 0 ${{ inputs.width }}x${{ inputs.height }}x24" \
            "${{ steps.bin.outputs.BIN }}" \
            +set fs_basepath "$GITHUB_WORKSPACE/GameData" \
            +set fs_homepath "$GITHUB_WORKSPACE/GameData" \
            +set logfile 2 \
            +exec render.cfg 2>&1 | tail -100 || true
          echo "=== RENDER WALL-CLOCK: $(( $(date +%s) - START ))s ==="

      - name: Show engine log
        if: always()
        run: |
          LOG=$(find GameData -iname "qconsole.log" | head -1)
          if [ -n "$LOG" ]; then cp "$LOG" qconsole.log; tail -120 qconsole.log; else echo "no qconsole.log"; fi

      - name: Find AVI output
        id: avi
        run: |
          AVI=$(find GameData -iname "*.avi" | head -1)
          if [ -z "$AVI" ]; then
            echo "No AVI produced -- render failed" >&2
            exit 1
          fi
          echo "AVI=$AVI" >> "$GITHUB_OUTPUT"
          ls -la "$AVI"

      - name: Inspect and convert
        run: |
          echo "=== IS THERE AN AUDIO STREAM? ==="
          ffprobe -v error -show_entries stream=codec_type,codec_name,duration,nb_frames,sample_rate,channels \
            -of default=noprint_wrappers=1 "${{ steps.avi.outputs.AVI }}" | tee ffprobe-report.txt
          ffmpeg -y -i "${{ steps.avi.outputs.AVI }}" \
            -c:v libx264 -pix_fmt yuv420p -preset medium -crf 20 \
            -c:a aac -b:a 128k render-gate1.mp4
          echo "=== OUTPUT ==="
          ls -la render-gate1.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 render-gate1.mp4
          # Prove the audio track is not just present but non-silent.
          echo "=== AUDIO LEVELS (mean_volume of -91dB means silence) ==="
          ffmpeg -i render-gate1.mp4 -af volumedetect -f null /dev/null 2>&1 | grep -E "volume|Stream" || true

      - name: Grab still frames
        run: |
          for t in 1 5 10; do
            ffmpeg -y -ss $t -i render-gate1.mp4 -frames:v 1 "frame-${t}s.jpg" 2>/dev/null || true
          done
          ls -la frame-*.jpg || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-gate1-output
          path: |
            render-gate1.mp4
            frame-*.jpg
            ffprobe-report.txt
            qconsole.log
          retention-days: 3
          if-no-files-found: warn
