name: Brightness Test

# Are native renders darker than the same demo in the browser?
#
# tr_init.cpp sets r_intensity 2 under __EMSCRIPTEN__ and 1 otherwise, with a
# comment explaining why: overbright normally arrives via the hardware gamma
# ramp, a canvas has none, so the browser gets that stop back in software.
#
# A headless X server under llvmpipe has no usable gamma ramp either, so the
# native render build may be falling into the same gap while keeping the
# setting meant for hardware that can do it -- which would make every render a
# stop darker than the site.
#
# Renders the same moment at both values and reports which gamma method the
# engine actually chose, so the answer comes from frames rather than reasoning.
on:
  workflow_dispatch:

env:
  ASSET_VERSION: "20260805"
  R2_PUBLIC: "https://pub-76bff0ef02794a5d95b7e2a8b8660f61.r2.dev"

jobs:
  brightness:
    name: r_intensity 1 vs 2
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true, fetch-depth: 0, path: jk2mv }

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake \
            libsdl2-dev libgl1-mesa-dev libopenal-dev libjpeg-dev libpng-dev libminizip-dev \
            xvfb libgl1-mesa-dri ffmpeg

      - name: Build engine
        run: |
          cmake -S jk2mv -B jk2mv/build/actions \
            -DCMAKE_BUILD_TYPE=Release -DUseInternalLibs=OFF -DBuildPortableVersion=ON
          cmake --build jk2mv/build/actions -j"$(nproc)"

      - name: Resolve game root
        id: root
        run: echo "ROOT=$GITHUB_WORKSPACE/jk2mv/build/actions/out/Release" >> "$GITHUB_OUTPUT"

      - name: Restore game assets from cache
        id: assetcache
        uses: actions/cache@v4
        with: { path: assets/base-min.tar, key: "jk2-assets-20260805" }

      - name: Download game assets
        if: steps.assetcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p assets
          curl -fsSL -o assets/base-min.tar "$R2_PUBLIC/render-assets/$ASSET_VERSION/base-min.tar"

      - name: Stage
        env: { ROOT: "${{ steps.root.outputs.ROOT }}" }
        run: |
          mkdir -p "$ROOT/base/demos"
          tar -xf assets/base-min.tar -C "$ROOT/base"
          curl -fsSL -o "$ROOT/base/demos/gate-demo.dm_15" \
            "$R2_PUBLIC/render-assets/$ASSET_VERSION/gate-demo.dm_15"

      - name: Render at both intensities
        timeout-minutes: 40
        env:
          ROOT: ${{ steps.root.outputs.ROOT }}
          LIBGL_ALWAYS_SOFTWARE: "1"
          SDL_AUDIODRIVER: "dummy"
        run: |
          set -u
          pass () {
            NAME="$1"; INTENSITY="$2"
            {
              echo "set com_hunkMegs 256"
              echo "set r_mode -1"; echo "set r_customwidth 1280"; echo "set r_customheight 720"
              echo "set r_fullscreen 0"; echo "set r_swapInterval 0"
              echo "set s_useOpenAL 0"
              echo "set cl_aviFrameRate 30"
              echo "set cl_aviMotionJpeg 1"; echo "set cl_aviMotionJpegQuality 95"
              echo "set cg_fov 120"; echo "set cg_draw2D 1"
              echo "set cl_noprint 0"; echo "set con_notifytime 10"; echo "set cg_drawChat 0"
              echo ""
              echo "demo gate-demo"
              echo "wait 20"
              echo "set cg_demoFollow 4"
              echo "set cg_thirdPerson 1"; echo "set cg_thirdPersonRange 80"
              echo "set cg_thirdPersonAngle 0"; echo "set cg_cameraOrbit 0"
              echo "wait 200"
              echo "video $NAME"
              echo "wait 200"
              echo "stopvideo"
              echo "quit"
            } > "$ROOT/base/$NAME.cfg"

            # r_intensity is CVAR_LATCH, so it has to be set before the renderer
            # starts -- setting it inside the cfg would be read too late and
            # silently do nothing.
            xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
              "$ROOT/jk2mvmp" +set fs_basepath "$ROOT" +set fs_homepath "$ROOT" \
              +set r_intensity "$INTENSITY" \
              +exec "$NAME.cfg" 2>&1 | grep -iE "gamma|intensity|overbright" | head -8
            echo "--- rendered $NAME at r_intensity $INTENSITY"
          }

          pass intensity-1 1
          pass intensity-2 2

      - name: Extract frames
        env: { ROOT: "${{ steps.root.outputs.ROOT }}" }
        run: |
          mkdir -p out
          find "$ROOT" -name "*.avi" -print0 | while IFS= read -r -d '' AVI; do
            N=$(basename "$AVI" .avi)
            ffmpeg -nostdin -y -i "$AVI" -c:v libx264 -crf 20 -preset veryfast \
              -pix_fmt yuv420p -an "out/$N.mp4" >/dev/null 2>&1 || true
            ffmpeg -nostdin -y -ss 3 -i "out/$N.mp4" -frames:v 1 "out/$N.jpg" >/dev/null 2>&1 || true
            # Mean luminance, so the difference is a number as well as a picture.
            echo -n "$N mean brightness: "
            ffmpeg -nostdin -i "out/$N.mp4" -vf "format=gray,signalstats,metadata=print:key=lavfi.signalstats.YAVG" \
              -frames:v 30 -f null - 2>&1 | grep -o "YAVG=[0-9.]*" | tail -1 || echo "n/a"
          done
          ls -la out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brightness-test-output
          path: out/
          retention-days: 3
          if-no-files-found: warn
