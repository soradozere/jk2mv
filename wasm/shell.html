<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>OpenJK — Jedi Academy</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #eee;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #status {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 10px;
        }

        canvas.emscripten {
            border: 0;
            cursor: none;
            outline: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .spinner {
            display: none;
        }

        #output {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 150px;
            background: rgba(0, 0, 0, 0.85);
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            overflow-y: auto;
            padding: 5px;
            display: none;
        }

        #following {
            position: fixed;
            top: 22px;
            left: 0;
            right: 0;
            z-index: 40;
            text-align: center;
            pointer-events: none;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: .01em;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, .85);
        }

        #following[hidden] {
            display: none;
        }

        #following .label[hidden] {
            display: none;
        }

        #following .label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, .62);
            margin-bottom: 2px;
        }

        /* Playback controls. Kept out of the way until the pointer is near the
           bottom of the frame, so they don't sit over the action while watching. */
        #controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 14px 18px;
            background: linear-gradient(to top, rgba(8, 10, 14, 0.94), rgba(8, 10, 14, 0.72) 60%, rgba(8, 10, 14, 0));
            font-size: 12px;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity .18s ease, transform .18s ease;
        }

        #controls.show,
        #controls:hover,
        #controls:focus-within {
            opacity: 1;
            transform: none;
        }

        #controls .row {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        /* display:flex above would otherwise win over the hidden attribute */
        #controls .row[hidden],
        #controls[hidden] {
            display: none;
        }

        #controls .group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 130px;
        }

        #controls .group.grow {
            flex: 1 1 160px;
        }

        #controls label {
            color: #93a1b5;
            font-size: 11px;
            letter-spacing: .02em;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        #controls .val {
            color: #e6edf6;
            font-variant-numeric: tabular-nums;
        }

        .btn {
            background: rgba(255, 255, 255, .08);
            color: #e6edf6;
            border: 1px solid rgba(255, 255, 255, .16);
            border-radius: 6px;
            padding: 7px 12px;
            font: inherit;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn:hover {
            background: rgba(255, 255, 255, .15);
        }

        .btn.wide {
            min-width: 84px;
        }

        .btn.on {
            background: #2f81f7;
            border-color: #2f81f7;
            color: #fff;
        }

        .speeds {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        /* Team colour down the leading edge, so a 5v5 picker reads at a glance
           without turning the names themselves into low-contrast text. */
        .btn.team1 {
            border-left: 3px solid #e5484d;
        }

        .btn.team2 {
            border-left: 3px solid #3b82f6;
        }

        /* Absent from the current snapshot -- selectable, but the camera will
           hold its last known position rather than track them. */
        .btn.unseen {
            opacity: .45;
        }

        .speeds .btn {
            padding: 6px 9px;
        }

        #controls .hint {
            color: #7d8b9e;
            font-size: 11px;
            line-height: 1.5;
            align-self: center;
            flex: 1 1 240px;
            min-width: 240px;
        }

        #controls .hint b {
            color: #b9c6d6;
            font-weight: 600;
        }

        #controls input[type=range] {
            width: 100%;
            accent-color: #2f81f7;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="status">Downloading...</div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <!-- Was drawn by the game's own HUD. Lives here so it can be styled as part
         of the site, and so the engine's 2D layer keeps shrinking toward "just
         the player HUD" for the embedded build. -->
    <div id="following" hidden><span class="label" id="followLabel">Following</span><span id="followName"></span></div>

    <div id="controls" hidden>
        <div class="row">
            <button id="playPause" class="btn wide" title="Play / pause (Space)">Pause</button>

            <div class="group">
                <label>Speed</label>
                <div class="speeds" id="speeds"></div>
            </div>

            <div class="group grow">
                <label>Field of view <span class="val" id="fovVal">80</span></label>
                <input type="range" id="fov" min="60" max="130" step="1" value="80">
            </div>

            <div class="group">
                <label>Camera</label>
                <div class="speeds" id="camModes"></div>
            </div>
        </div>

        <div class="row" id="povRow">
            <div class="group">
                <label>Watching</label>
                <div class="speeds" id="povList"></div>
            </div>
        </div>

        <div class="row" id="freeRow" hidden>
            <div class="group grow">
                <label>Flight speed <span class="val" id="camSpeedVal">800</span></label>
                <input type="range" id="camSpeed" min="100" max="3000" step="50" value="800">
            </div>
            <div class="hint grow">
                Click the view to look around. <b>W A S D</b> flies, <b>Space</b> and <b>C</b> go up and down.
            </div>
        </div>

        <div class="row" id="orbitRow" hidden>
            <div class="group grow">
                <label>Camera distance <span class="val" id="rangeVal">80</span></label>
                <input type="range" id="range" min="20" max="400" step="5" value="80">
            </div>
            <div class="group grow">
                <label>Camera angle <span class="val" id="angleVal">0</span>&deg;</label>
                <input type="range" id="angle" min="-180" max="180" step="5" value="0">
            </div>
            <div class="group grow">
                <label>Camera height <span class="val" id="heightVal">0</span></label>
                <input type="range" id="height" min="-60" max="120" step="5" value="0">
            </div>
        </div>
    </div>

    <div id="output"></div>

    <script type='text/javascript'>
        console.log("--- SHELL VERSION: 2026-03-08 11:13 ---");
        window.addEventListener('error', function (e) {
            console.error('WASMDBG_JSERROR: ' + e.message + ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno + (e.error && e.error.stack ? ('\n' + e.error.stack) : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
            console.error('WASMDBG_JSREJECT: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
        });
        var statusElement = document.getElementById('status');
        var canvasElement = document.getElementById('canvas');
        var outputElement = document.getElementById('output');

        // Toggle console with backtick
        document.addEventListener('keydown', function (e) {
            if (e.key === '`') {
                outputElement.style.display = outputElement.style.display === 'none' ? 'block' : 'none';
            }
        });

        // Optional ?demo=<name> queues "+demo <name>" as a real command-line arg,
        // which Com_AddStartupCommands() runs AFTER CL_Init() registers "demo" --
        // unlike autoexec.cfg, which execs too early and hits "Unknown command".
        var __params = new URLSearchParams(location.search);
        var __demoParam = __params.get('demo');
        // ?demoUrl= fetches a demo at runtime instead of taking one from the
        // preloaded bundle. Bundling doesn't scale: a single full session runs to
        // 400MB, which alone is larger than every game asset put together, and
        // each new demo would mean a rebuild. Fetched demos are written straight
        // into the VFS, so the engine finds them exactly as if they'd shipped.
        var __demoUrl = __params.get('demoUrl');
        var Module = {
            arguments: (__demoParam && !__demoUrl) ? ['+demo', __demoParam] : [],
            print: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
                if (outputElement) {
                    outputElement.innerHTML += text + '<br>';
                    outputElement.scrollTop = outputElement.scrollHeight;
                }
            },
            printErr: function (text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                // Bounded ring buffer: the devtools console evicts early startup
                // lines long before they can be read back, and an unbounded array
                // is enough output to lock the tab up.
                var b = window.__log || (window.__log = []);
                b.push(text);
                if (b.length > 400) b.shift();
                console.error(text);
            },
            canvas: canvasElement,
            setStatus: function (text) {
                if (text) statusElement.innerHTML = text;
                else statusElement.style.display = 'none';
            },
            totalDependencies: 0,
            monitorRunDependencies: function (left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'Running...');
            },
            preRun: [function () {
                try {
                    FS.mkdir('/saves');
                } catch (e) { }
            }]
        };
        Module.setStatus('Downloading...');
        window.onerror = function () {
            Module.setStatus('Exception thrown, see JavaScript console');
        };

        // ---- Playback controls -------------------------------------------------
        // Everything here drives engine cvars through the JKD_Exec bridge, so the
        // UI stays a thin shell over the engine's own state rather than keeping a
        // parallel copy of it.
        (function () {
            var exec = null, getCvar = null;
            var controls = document.getElementById('controls');
            var els = {
                playPause: document.getElementById('playPause'),
                speeds: document.getElementById('speeds'),
                fov: document.getElementById('fov'),
                fovVal: document.getElementById('fovVal'),
                camModes: document.getElementById('camModes'),
                povList: document.getElementById('povList'),
                freeRow: document.getElementById('freeRow'),
                camSpeed: document.getElementById('camSpeed'),
                camSpeedVal: document.getElementById('camSpeedVal'),
                orbitRow: document.getElementById('orbitRow'),
                range: document.getElementById('range'),
                rangeVal: document.getElementById('rangeVal'),
                angle: document.getElementById('angle'),
                angleVal: document.getElementById('angleVal'),
                height: document.getElementById('height'),
                heightVal: document.getElementById('heightVal')
            };

            var paused = false;
            var camMode = 'first';
            var speed = 1;
            var SPEEDS = [0.1, 0.25, 0.5, 1, 2, 4];
            var CAM_MODES = [
                { id: 'first', label: 'Follow' },
                { id: 'third', label: 'Chase' },
                { id: 'free', label: 'Free fly' }
            ];

            function setCvar(name, value) {
                if (exec) exec(name + ' ' + value);
            }

            // Hand the keyboard back to the engine after a control is used. The
            // stopPropagation guard further down is scoped to #controls, so as
            // long as a button keeps focus every keystroke is swallowed there --
            // which silently breaks flying the free camera the moment you click
            // "Free fly", since the button that turned it on is still focused.
            function releaseFocus() {
                if (document.activeElement && controls.contains(document.activeElement)) {
                    document.activeElement.blur();
                }
                canvasElement.focus();
            }

            function setPaused(p) {
                paused = p;
                setCvar('cl_freezeDemo', paused ? 1 : 0);
                els.playPause.textContent = paused ? 'Play' : 'Pause';
                els.playPause.classList.toggle('on', paused);
            }

            function setSpeed(s) {
                speed = s;
                setCvar('timescale', s);
                Array.prototype.forEach.call(els.speeds.children, function (b) {
                    b.classList.toggle('on', parseFloat(b.dataset.speed) === s);
                });
            }

            // Chase framing lives in cvars the engine keeps between modes, so
            // leaving Chase and coming back to Follow would otherwise carry a
            // 400-unit pullback and a 90 degree orbit into a view that is
            // supposed to be the recorded one.
            var CHASE_DEFAULTS = [
                ['range', 'rangeVal', 'cg_thirdPersonRange', 80, ''],
                ['angle', 'angleVal', 'cg_thirdPersonAngle', 0, '°'],
                ['height', 'heightVal', 'cg_thirdPersonVertOffset', 0, '']
            ];

            function resetChase() {
                CHASE_DEFAULTS.forEach(function (d) {
                    els[d[0]].value = d[3];
                    els[d[1]].textContent = d[3] + d[4];
                    setCvar(d[2], d[3]);
                });
            }

            function setCamMode(mode) {
                if (camMode === 'third' && mode !== 'third') resetChase();
                camMode = mode;
                setCvar('cg_thirdPerson', mode === 'third' ? 1 : 0);
                setCvar('cg_demoCam', mode === 'free' ? 1 : 0);
                els.orbitRow.hidden = mode !== 'third';
                els.freeRow.hidden = mode !== 'free';
                Array.prototype.forEach.call(els.camModes.children, function (b) {
                    b.classList.toggle('on', b.dataset.mode === mode);
                });
            }

            SPEEDS.forEach(function (s) {
                var b = document.createElement('button');
                b.className = 'btn';
                b.textContent = (s === 1 ? '1' : String(s)) + '×';
                b.dataset.speed = s;
                b.onclick = function () { setSpeed(s); releaseFocus(); };
                els.speeds.appendChild(b);
            });

            CAM_MODES.forEach(function (m) {
                var b = document.createElement('button');
                b.className = 'btn';
                b.textContent = m.label;
                b.dataset.mode = m.id;
                b.onclick = function () { setCamMode(m.id); releaseFocus(); };
                els.camModes.appendChild(b);
            });

            els.playPause.onclick = function () { setPaused(!paused); releaseFocus(); };

            function bindRange(el, valEl, cvar, suffix) {
                el.addEventListener('input', function () {
                    valEl.textContent = el.value + (suffix || '');
                    setCvar(cvar, el.value);
                });
                // on release, not on input -- blurring mid-drag would end the drag
                el.addEventListener('change', releaseFocus);
            }
            bindRange(els.fov, els.fovVal, 'cg_fov');
            bindRange(els.camSpeed, els.camSpeedVal, 'cg_demoCamSpeed');
            bindRange(els.range, els.rangeVal, 'cg_thirdPersonRange');
            bindRange(els.angle, els.angleVal, 'cg_thirdPersonAngle', '°');
            bindRange(els.height, els.heightVal, 'cg_thirdPersonVertOffset');

            // Keep keystrokes aimed at the controls away from the engine, which
            // otherwise also sees them (space would toggle pause *and* reach the
            // game, arrow keys would nudge a slider and the view at once).
            ['keydown', 'keyup', 'keypress'].forEach(function (t) {
                controls.addEventListener(t, function (e) { e.stopPropagation(); });
            });

            // Space toggles pause anywhere except while a control has focus -- and
            // except in free-fly, where Space is the camera's "up" and has to reach
            // the engine untouched.
            window.addEventListener('keydown', function (e) {
                if (e.code === 'Space' && camMode !== 'free' && !controls.contains(document.activeElement)) {
                    e.preventDefault();
                    setPaused(!paused);
                }
            });

            // Reveal on pointer activity near the bottom of the frame.
            var hideTimer = null;
            window.addEventListener('mousemove', function (e) {
                var nearBottom = e.clientY > window.innerHeight - 160;
                controls.classList.toggle('show', nearBottom);
                clearTimeout(hideTimer);
                if (nearBottom) {
                    hideTimer = setTimeout(function () {
                        if (!controls.matches(':hover, :focus-within')) controls.classList.remove('show');
                    }, 2500);
                }
            });

            // Wire up once the engine is actually running, then seed the controls
            // from the engine's real cvar values instead of assuming the defaults.
            // POV switching. The engine owns who is being watched (cg_demoFollow);
            // the page only renders the roster and sets the cvar, so the two can't
            // disagree about state.
            var povFollow = -1;

            function setFollow(clientNum) {
                povFollow = clientNum;
                setCvar('cg_demoFollow', clientNum);
                Array.prototype.forEach.call(els.povList.children, function (b) {
                    b.classList.toggle('on', parseInt(b.dataset.client, 10) === clientNum);
                });
            }

            function startPovPicker() {
                var connMask = Module.cwrap('JKD_GetConnectedMask', 'number', []);
                var visMask = Module.cwrap('JKD_GetVisibleMask', 'number', []);
                var playerInfo = Module.cwrap('JKD_GetPlayerInfo', 'string', ['number']);
                var lastRoster = '';

                setInterval(function () {
                    var conn = connMask(), vis = visMask();
                    var players = [];
                    for (var i = 0; i < 32; i++) {
                        if (!(conn & (1 << i))) continue;
                        var cs = playerInfo(i) || '';
                        var nm = /^n\\([^\\]*)/.exec(cs);
                        var tm = /\\t\\(\d+)/.exec(cs);
                        var team = tm ? parseInt(tm[1], 10) : -1;
                        // team 3 is spectator -- that's the recording bot and any
                        // idle onlookers, none of whom are worth watching
                        if (team !== 1 && team !== 2) continue;
                        players.push({
                            num: i,
                            name: nm ? nm[1].replace(/\^./g, '') : ('client ' + i),
                            team: team,
                            visible: !!(vis & (1 << i))
                        });
                    }

                    // Rebuild only when the roster or visibility actually changes;
                    // this runs 4x a second and would otherwise fight the mouse.
                    var sig = players.map(function (p) { return p.num + p.name + p.team + (p.visible ? 1 : 0); }).join('|');
                    if (sig === lastRoster) return;
                    lastRoster = sig;

                    els.povList.innerHTML = '';
                    var rec = document.createElement('button');
                    rec.className = 'btn';
                    rec.textContent = 'Recorded view';
                    rec.dataset.client = -1;
                    rec.onclick = function () { setFollow(-1); releaseFocus(); };
                    els.povList.appendChild(rec);

                    players.sort(function (a, b) { return a.team - b.team || a.num - b.num; });
                    players.forEach(function (p) {
                        var b = document.createElement('button');
                        b.className = 'btn team' + p.team + (p.visible ? '' : ' unseen');
                        b.textContent = p.name;
                        b.dataset.client = p.num;
                        b.title = p.visible ? '' : 'Not in the demo data right now';
                        b.onclick = function () { setFollow(p.num); releaseFocus(); };
                        els.povList.appendChild(b);
                    });

                    Array.prototype.forEach.call(els.povList.children, function (b) {
                        b.classList.toggle('on', parseInt(b.dataset.client, 10) === povFollow);
                    });
                }, 250);
            }

            // Who the demo is currently watching. Composed from the engine's own
            // state rather than mirrored, so it can't drift out of sync, and it's
            // the same pair of exports a POV picker will read.
            function startFollowReadout() {
                var viewClient = Module.cwrap('JKD_GetViewClientNum', 'number', []);
                var playerInfo = Module.cwrap('JKD_GetPlayerInfo', 'string', ['number']);
                var isFollowing = Module.cwrap('JKD_IsFollowing', 'number', []);
                var visibleMask = Module.cwrap('JKD_GetVisibleMask', 'number', []);
                var followEl = document.getElementById('following');
                var nameEl = document.getElementById('followName');
                var labelEl = document.getElementById('followLabel');
                var last = null;
                var seeded = false;

                setInterval(function () {
                    // cgame comes up with the demo, not with the engine; re-apply
                    // the camera mode the moment its cvars actually exist
                    if (!seeded && viewClient() >= 0) {
                        seeded = true;
                        setCamMode(camMode);
                        setFollow(povFollow);
                    }
                    if (camMode === 'free') {
                        // detached: naming a player here would suggest the view is
                        // still theirs, which is exactly the impression to avoid
                        followEl.hidden = false;
                        labelEl.hidden = true;
                        nameEl.textContent = 'Free camera';
                        last = null;
                        return;
                    }
                    // Watching a chosen player wins; otherwise report whoever the
                    // demo itself is on.
                    var n = povFollow >= 0 ? povFollow : viewClient();
                    // PMF_FOLLOW is how the game decides whether to say
                    // "Following" -- a player's own demo isn't following anyone,
                    // and labelling it that way reads as a bug.
                    var verb = (povFollow >= 0 || isFollowing()) ? 'Watching' : 'Recorded by';
                    // On PVS-limited demos the chosen player drops out of the data
                    // for long stretches; say so rather than let a frozen camera
                    // look like a bug.
                    var lost = povFollow >= 0 && !(visibleMask() & (1 << povFollow));
                    if (lost) verb += ' — out of view';
                    var key = verb + ':' + n;
                    if (n < 0) { followEl.hidden = true; last = null; return; }
                    if (key === last) return;
                    last = key;
                    labelEl.textContent = verb;
                    // "n\<name>\t\<team>\..." -- strip JK2's ^n colour codes
                    var m = /^n\\([^\\]*)/.exec(playerInfo(n) || '');
                    var name = m ? m[1].replace(/\^./g, '') : '';
                    nameEl.textContent = name;
                    followEl.hidden = !name;
                }, 250);
            }

            // Pull a demo over HTTP and hand it to the engine through the VFS.
            // Streamed into a single buffer rather than FS.createLazyFile, whose
            // synchronous XHR would stall the frame loop mid-playback.
            function loadDemoFromUrl(url) {
                var base = decodeURIComponent(url.split('/').pop().split('?')[0]);
                var name = base.replace(/\.dm_\d+$/i, '');
                Module.setStatus('Fetching demo...');
                fetch(url).then(function (r) {
                    if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
                    var total = parseInt(r.headers.get('content-length') || '0', 10);
                    if (!r.body) return r.arrayBuffer().then(function (b) { return new Uint8Array(b); });
                    var reader = r.body.getReader(), chunks = [], got = 0;
                    return (function pump() {
                        return reader.read().then(function (res) {
                            if (res.done) {
                                var out = new Uint8Array(got), at = 0;
                                chunks.forEach(function (c) { out.set(c, at); at += c.length; });
                                return out;
                            }
                            chunks.push(res.value);
                            got += res.value.length;
                            if (total) Module.setStatus('Fetching demo... ' + Math.round(100 * got / total) + '%');
                            return pump();
                        });
                    })();
                }).then(function (bytes) {
                    try { FS.mkdir('/base/demos'); } catch (e) { }
                    FS.writeFile('/base/demos/' + base, bytes);
                    Module.setStatus('');
                    exec('demo "' + name + '"');
                }).catch(function (e) {
                    Module.setStatus('Could not load demo: ' + e.message);
                    statusElement.style.display = '';
                });
            }

            // Playback ended or a demo failed to open. There is no menu to fall
            // back to by design, so the page has to say what happened.
            window.JKD_playbackStopped = function () {
                Module.setStatus('Playback ended.');
                statusElement.style.display = '';
            };

            window.JKD_ready = function () {
                exec = Module.cwrap('JKD_Exec', null, ['string']);
                getCvar = Module.cwrap('JKD_GetCvar', 'number', ['string']);
                startFollowReadout();
                startPovPicker();
                if (__demoUrl) loadDemoFromUrl(__demoUrl);

                var fov = getCvar('cg_fov') || 80;
                els.fov.value = fov;
                els.fovVal.textContent = Math.round(fov);

                setSpeed(1);
                setPaused(false);
                // Camera cvars belong to cgame, which doesn't exist until a demo
                // loads -- seeding them now just logs "Unknown command" and the
                // UI's starting state silently never reaches the engine. Set the
                // page's own state, and push it across once cgame is up.
                camMode = 'first';
                setCamMode('first');
                controls.hidden = false;
                controls.classList.add('show');
                setTimeout(function () { controls.classList.remove('show'); }, 3000);
            };
        })();
    </script>

</body>
