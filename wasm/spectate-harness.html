<!doctype html>
<!--
  Throwaway test harness for the live-spectate bridge prototype (Brief 1 of
  2). Not part of the viewer build, not linked from anywhere Soracle serves.

  Requires a wasm build made with -DJKD_LIVE_CONNECT=ON (see
  wasm/CMakeLists.txt). Against a normal build, JKD_ConnectSpectate simply
  doesn't exist and the Connect button will say so.

  Serve this from the jk2mv project root so the relative path below reaches
  the build output, e.g.:

      python3 serve.py 8090 .

  then open http://localhost:8090/wasm/spectate-harness.html

  How "Bridge address" works: the engine's `connect` command dials whatever
  address string it's given, and Emscripten's socket emulation turns a plain
  TCP/UDP connect() into a WebSocket to that same host:port by default -- no
  extra JS-side config needed for a single same-box bridge. So the bridge's
  own websockify address IS the connect target; there's deliberately only
  one field. If snapshots never arrive and the console shows the handshake
  retrying forever, the first thing to check is whether that default-dial
  assumption held -- the fallback is setting Module.websocket.url explicitly
  before load, which this file does not do on purpose (see the comment
  above bootEngine()).
-->
<html lang="en-us">
<head>
<meta charset="utf-8">
<title>live-spectate harness</title>
<style>
  body { background: #111; color: #ddd; font-family: monospace; margin: 0; padding: 12px; }
  #controls { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  input { font-family: monospace; font-size: 13px; padding: 4px 6px; width: 320px; }
  button { font-family: monospace; font-size: 13px; padding: 4px 12px; }
  button:disabled { opacity: 0.5; }
  canvas { display: block; background: #000; width: 800px; height: 450px; }
  #log { white-space: pre-wrap; font-size: 12px; line-height: 1.4; max-height: 40vh; overflow-y: auto;
         background: #000; border: 1px solid #333; padding: 8px; margin-top: 10px; }
  .err { color: #f66; }
  .ok { color: #6f6; }
</style>
</head>
<body>

<div id="controls">
  <label>Server
    <select id="server"><option>booting…</option></select>
  </label>
  <label>Version
    <select id="ver">
      <option value="0" selected>auto-detect</option>
      <option value="2">force 1.02</option>
      <option value="4">force 1.04</option>
    </select>
  </label>
  <button id="connectBtn" disabled>Connect</button>
  <button id="disconnectBtn" disabled>Disconnect</button>
  <span id="status">booting engine…</span>
  <span id="connState">state: —</span>
</div>

<canvas id="canvas"></canvas>

<div id="log"></div>

<script>
const logEl = document.getElementById("log");
const statusEl = document.getElementById("status");
const connectBtn = document.getElementById("connectBtn");
const disconnectBtn = document.getElementById("disconnectBtn");
const serverSel = document.getElementById("server");
const connStateEl = document.getElementById("connState");

// Bound after the engine boots.
let jkd = null;
const STATE_NAMES = { 0: "disconnected", 1: "connecting", 2: "active" };

function log(text, cls) {
  console.log("[harness]", text);
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = text;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

// Deliberately no Module.websocket override -- see the file header. This is
// the simplest thing that could work, and whether it does is exactly what
// this prototype exists to find out.
// Release by default: the dev build's assertions turn a renderer complaint
// into a dead page (NDEBUG makes several of them a survivable early-out
// instead -- same reason tools/build-release.sh exists). Append
// ?build=dev for the assertion-heavy build when diagnosing.
const BUILD_DIR = new URLSearchParams(location.search).get("build") === "dev"
  ? "../build-wasm-livespectate"
  : "../build-wasm-livespectate-rel";

// The bridge URL comes from the engine's allowlist at connect time (see the
// connect handler), not from here. Emscripten reads Module.websocket.url when
// it creates each socket, and websocketArgs holds this very object by
// reference -- so assigning to it before connecting is picked up.
//
// Note this page is served over plain http and still opens wss: allowed and
// deliberate. Only the reverse (an https page opening ws://) is blocked as
// mixed content, which is exactly why the TLS front exists for the real
// /live page.

function bootEngine() {
  log(`using build: ${BUILD_DIR}`);
  window.Module = {
    // Populated per-connect from the engine's allowlist. Must exist at boot:
    // Emscripten captures this object by reference during runtime init.
    websocket: {},
    canvas: document.getElementById("canvas"),
    locateFile: (path) => `${BUILD_DIR}/${path}`,
    setStatus: (text) => { statusEl.textContent = text || "running"; },
    print: (text) => log(text),
    printErr: (text) => log(text, "err"),
    onAbort: (what) => log(`ENGINE ABORTED: ${what}`, "err"),
  };

  window.JKD_ready = () => {
    log("JKD_ready -- engine booted", "ok");
    statusEl.textContent = "ready";
    if (typeof Module._JKD_ConnectSpectate === "undefined" &&
        typeof Module.asm?._JKD_ConnectSpectate === "undefined") {
      log("JKD_ConnectSpectate not found in this build -- rebuild with -DJKD_LIVE_CONNECT=ON", "err");
      return;
    }
    jkd = {
      connect: Module.cwrap("JKD_ConnectSpectate", "number", ["number"]),
      disconnect: Module.cwrap("JKD_Disconnect", null, []),
      state: Module.cwrap("JKD_GetConnectionState", "number", []),
      serverCount: Module.cwrap("JKD_GetServerCount", "number", []),
      serverName: Module.cwrap("JKD_GetServerName", "string", ["number"]),
      serverUrl: Module.cwrap("JKD_GetServerUrl", "string", ["number"]),
      forceVersion: Module.cwrap("JKD_ForceGameversion", null, ["number"]),
    };
    // Populate the picker from the engine's own allowlist -- the addresses
    // live in C, the page only ever learns names and indices.
    serverSel.innerHTML = "";
    const n = jkd.serverCount();
    for (let i = 0; i < n; i++) {
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = jkd.serverName(i);
      serverSel.appendChild(opt);
    }
    connectBtn.disabled = false;
    // Poll the engine for connection state; it owns the truth, we mirror it.
    setInterval(() => {
      if (!jkd) return;
      const s = jkd.state();
      connStateEl.textContent = `state: ${STATE_NAMES[s] || s}`;
      disconnectBtn.disabled = (s === 0);
    }, 500);
  };

  const script = document.createElement("script");
  script.src = `${BUILD_DIR}/jk2mv_wasm.js`;
  script.onerror = () => log(`could not load ${script.src} -- did the build finish, and is this served from the jk2mv project root?`, "err");
  document.body.appendChild(script);
}

connectBtn.addEventListener("click", () => {
  if (!jkd) return;
  const idx = parseInt(serverSel.value, 10);
  const ver = parseInt(document.getElementById("ver").value, 10);
  const url = jkd.serverUrl(idx);
  log(`connecting to server #${idx} (${jkd.serverName(idx)}) via ${url}, version=${ver}`);
  try {
    // Must be a complete URL: given a bare "wss://" prefix Emscripten would
    // append the address the engine dialled instead. Set before connecting --
    // it is read when the socket is created.
    Module.websocket.url = url;
    // Before connecting: CL_ServerInfoPacket only adopts the server's
    // version while the current one is still UNDEF.
    if (ver) jkd.forceVersion(ver);
    const ok = jkd.connect(idx);
    if (!ok) log(`refused: server #${idx} not in the engine allowlist`, "err");
  } catch (e) {
    log(`connect failed: ${e}`, "err");
  }
});

disconnectBtn.addEventListener("click", () => {
  if (!jkd) return;
  log("disconnecting");
  try {
    jkd.disconnect();
  } catch (e) {
    log(`disconnect failed: ${e}`, "err");
  }
});

log("loading jk2mv_wasm.js …");
bootEngine();
</script>

</body>
</html>
